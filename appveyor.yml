version: 1.0.{build}
image: Visual Studio 2026

configuration: Release

environment:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  NUGET_XMLDOC_MODE: skip

cache:
  - '%USERPROFILE%\.nuget\packages -> **\*.csproj, Directory.Build.props'

before_build:
  - ps: dotnet --info
  - ps: dotnet restore HttpMethodsSample.slnx --ignore-failed-sources /p:NuGetAudit=false

build_script:
  - ps: dotnet build HttpMethodsSample.slnx --configuration $env:CONFIGURATION --no-restore

test_script:
  - ps: New-Item -ItemType Directory -Force -Path TestResults | Out-Null
  - ps: dotnet test services/inventory-service/tests/Inventory.Tests/Inventory.Tests.csproj --configuration $env:CONFIGURATION --no-restore --logger "trx;LogFileName=inventory-tests.trx" --results-directory TestResults
  - ps: dotnet test services/diagnostics-service/tests/Diagnostics.Tests/Diagnostics.Tests.csproj --configuration $env:CONFIGURATION --no-restore --logger "trx;LogFileName=diagnostics-tests.trx" --results-directory TestResults

after_test:
  - ps: appveyor PushTestResults TestResults\inventory-tests.trx -Type mstest
  - ps: appveyor PushTestResults TestResults\diagnostics-tests.trx -Type mstest
  - ps: appveyor PushArtifact TestResults\inventory-tests.trx
  - ps: appveyor PushArtifact TestResults\diagnostics-tests.trx
